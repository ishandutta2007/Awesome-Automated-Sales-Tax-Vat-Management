<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      /* Dynamic Ambient Elements */
      .orb-pulse-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .orb-pulse-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .stream-flow {
        stroke-dasharray: 8 12;
        animation: dash 20s linear infinite;
      }
      .pill-float-1 {
        animation: float1 6s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: float2 7s ease-in-out infinite alternate;
      }
      .pill-float-3 {
        animation: float3 8s ease-in-out infinite alternate;
      }

      @keyframes pulse1 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
        100% { transform: scale(1.2) translate(40px, -20px); opacity: 0.45; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1) translate(0, 0); opacity: 0.2; }
        100% { transform: scale(1.25) translate(-30px, 30px); opacity: 0.4; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes float1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes float2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes float3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-7px); }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>

  <!-- Background Animated Glowing Orbs -->
  <g>
    <circle cx="150" cy="80" r="160" fill="#3b82f6" filter="url(#blur-glow)" class="orb-pulse-1" />
    <circle cx="1080" cy="180" r="180" fill="#8b5cf6" filter="url(#blur-glow)" class="orb-pulse-2" />
    <circle cx="650" cy="380" r="140" fill="#06b6d4" filter="url(#blur-glow)" class="orb-pulse-1" />
  </g>

  <!-- Subtle High-tech Grid Pattern in Background -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Animated Data Flow Streams (Behind Foreground Content) -->
  <g fill="none" stroke-width="2">
    <path d="M -50,180 Q 300,60 650,210 T 1250,150" stroke="#06b6d4" stroke-opacity="0.3" class="stream-flow" />
    <path d="M -50,260 Q 350,380 750,230 T 1250,300" stroke="#a855f7" stroke-opacity="0.25" class="stream-flow" style="animation-duration: 26s;" />
  </g>

  <!-- Side Floating Feature Badges (Background Accents, Carefully Positioned) -->
  <g class="pill-float-1" filter="url(#card-shadow)">
    <rect x="920" y="60" width="220" height="48" rx="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="945" cy="84" r="8" fill="#38bdf8"/>
    <text x="965" y="89" fill="#f1f5f9" font-size="14" font-weight="600">⚡ Real-Time Tax Nexus</text>
  </g>

  <g class="pill-float-2" filter="url(#card-shadow)">
    <rect x="940" y="130" width="210" height="48" rx="24" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="965" cy="154" r="8" fill="#a855f7"/>
    <text x="985" y="159" fill="#f1f5f9" font-size="14" font-weight="600">🇪🇺 EU VAT OSS &amp; VIES</text>
  </g>

  <g class="pill-float-3" filter="url(#card-shadow)">
    <rect x="900" y="200" width="240" height="48" rx="24" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="925" cy="224" r="8" fill="#10b981"/>
    <text x="945" y="229" fill="#f1f5f9" font-size="14" font-weight="600">🛡️ Auto Remit &amp; Filing</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Ensured 100% legible & unhidden) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <rect x="0" y="60" width="220" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.8"/>
    <text x="16" y="81" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">★ CURATED AWESOME LIST</text>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">
      Automated Sales Tax
    </text>
    <text x="0" y="195" fill="url(#accent-cyan)" font-size="44" font-weight="800" letter-spacing="-0.5">
      &amp; VAT Management
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" fill="#94a3b8" font-size="18" font-weight="400">
      Enterprise SaaS Platforms, Fiscal Nexus Engines &amp; Open-Source Calculation Libraries
    </text>

    <!-- Highlight Meta Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="135" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#e2e8f0" font-size="13" font-weight="600">📊 SaaS Tiers</text>

      <!-- Pill 2 -->
      <rect x="147" y="0" width="145" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="161" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🎁 Free Trials</text>

      <!-- Pill 3 -->
      <rect x="304" y="0" width="155" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="318" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🔓 Open Source</text>

      <!-- Pill 4 -->
      <rect x="471" y="0" width="165" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <text x="485" y="22" fill="#e2e8f0" font-size="13" font-weight="600">🌐 Global Nexus</text>
    </g>

    <!-- Bottom Metric Accent Bar -->
    <g transform="translate(0, 345)">
      <text x="0" y="0" fill="#64748b" font-size="13" font-weight="500">Global Tax Software Sector:</text>
      <text x="175" y="0" fill="#38bdf8" font-size="13" font-weight="700">$25B+ Market Size</text>
      <text x="310" y="0" fill="#64748b" font-size="13" font-weight="500">•</text>
      <text x="325" y="0" fill="#64748b" font-size="13" font-weight="500">Coverage:</text>
      <text x="390" y="0" fill="#10b981" font-size="13" font-weight="700">190+ Jurisdictions</text>
    </g>
  </g>
</svg>
